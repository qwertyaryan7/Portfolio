    <style>
        /* ==========================================================================
           FOUNDATION & LAYOUT DEFENSE (Strict Mobile-First & Anti-Bleed)
           ========================================================================== */
        :root {
            --bg-main: #31070D;
            --bg-accent: #570F1B;
            --decorative: #8B2635;
            --highlight: #D9A85F;
            --text-main: #F5EBDD;
            --dark-contrast: #171316;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            overflow-x: hidden;
            background-color: var(--bg-main); 
            font-family: 'Poppins', sans-serif;
            -webkit-font-smoothing: antialiased;
            color: var(--text-main);
        }

        .app-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 16px 16px 80px 16px;
            min-height: 100vh;
            display: block;
            background-color: var(--bg-main);
            position: relative;
        }

        /* ==========================================================================
           METRICS BAR (Organic Rounded Elements)
           ========================================================================== */
        .metrics-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap; 
            gap: 24px; 
            background: rgba(87, 15, 27, 0.4);
            padding: 18px 24px;
            border-radius: 40px;
            margin-bottom: 28px;
            border: 1px solid rgba(217, 168, 95, 0.15);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .tags-wrapper { 
            display: flex; 
            flex-wrap: wrap;
            gap: 12px; 
        }

        .tag {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 8px 16px;
            border-radius: 30px;
            background: var(--decorative);
            color: var(--text-main);
        }

        .tag.hollow {
            background: transparent;
            color: var(--highlight);
            border: 1px solid var(--highlight);
        }

        .view-counter { 
            font-size: 14px; 
            font-weight: 600; 
            color: rgba(245, 235, 221, 0.7); 
            margin-left: auto; 
        }
        
        .view-counter strong { color: var(--highlight); font-weight: 800; }

        /* ==========================================================================
           TINDER-STYLE FLASHCARD DECK 
           ========================================================================== */
        .deck-wrapper {
            position: relative;
            width: 100%;
            height: 540px; 
            margin-bottom: 40px;
            perspective: 1500px;
        }

        .flashcard {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: transparent;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.4s ease;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .flashcard.swiped {
            transform: translateX(130%) rotate(25deg) !important;
            opacity: 0 !important;
            pointer-events: none;
        }

        .flashcard-inner {
            position: relative;
            width: 100%; height: 100%;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            border-radius: 40px;
            box-shadow: 0 30px 60px rgba(23, 19, 22, 0.8);
        }

        .flashcard.is-flipped .flashcard-inner {
            transform: rotateY(180deg);
        }

        .flashcard-face {
            position: absolute;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 48px 32px;
            text-align: center;
        }

        .flashcard-front {
            background: linear-gradient(145deg, var(--bg-accent), var(--bg-main));
            border: 1px solid rgba(139, 38, 53, 0.6);
        }

        .flashcard-back {
            transform: rotateY(180deg);
            background: linear-gradient(145deg, var(--dark-contrast), var(--bg-main));
            border: 1px solid rgba(217, 168, 95, 0.3);
            justify-content: flex-start;
            padding-top: 50px;
        }

        .card-label {
            font-size: 13px; font-weight: 800; text-transform: uppercase;
            letter-spacing: 3px; color: var(--highlight); margin-bottom: auto;
            position: absolute; top: 32px; left: 0; width: 100%; text-align: center;
            opacity: 0.8;
        }
        
        .card-content-wrapper {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; flex: 1; width: 100%;
            margin-top: 10px; margin-bottom: 36px;
        }

        .flashcard-back .card-content-wrapper {
            justify-content: flex-start; overflow-y: auto; padding: 0 10px;
            margin-bottom: 70px; scrollbar-width: none;
        }
        .flashcard-back .card-content-wrapper::-webkit-scrollbar { display: none; }

        .flashcard-front .card-content {
            font-family: 'Sora', sans-serif;
            font-size: 42px; font-weight: 700; line-height: 1.2;
            color: var(--highlight); letter-spacing: 1px;
        }

        .flashcard-back .card-content {
            font-size: 18px; font-weight: 500; color: var(--text-main);
            line-height: 1.6; margin-bottom: 16px;
        }
        
        .hindi-meaning {
            color: var(--highlight); font-size: 20px; font-weight: 800; display: block; margin-top: 6px;
        }

        .card-example {
            font-size: 15px; font-style: italic; color: rgba(245, 235, 221, 0.7);
            line-height: 1.5; margin-bottom: 20px; padding: 0 16px;
        }
        .card-example::before, .card-example::after { content: '"'; color: var(--highlight); font-weight: 800; font-size: 18px; }

        .card-syn-ant {
            font-size: 13px; text-align: left; width: 100%; 
            background: rgba(245, 235, 221, 0.05);
            padding: 16px; border-radius: 24px; 
            border: 1px solid rgba(245, 235, 221, 0.08); 
            line-height: 1.6;
        }
        .card-syn-ant div { margin-bottom: 8px; color: var(--text-main); }
        .card-syn-ant div:last-child { margin-bottom: 0; }
        .card-syn-ant strong { display: inline-block; width: 90px; font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }

        .syn-label { color: var(--highlight); }
        .ant-label { color: var(--decorative); }

        .tap-hint {
            position: absolute; bottom: 44px; font-size: 12px; font-weight: 800;
            color: var(--highlight); text-transform: uppercase; letter-spacing: 1px;
            background: rgba(217, 168, 95, 0.1); padding: 12px 28px; border-radius: 30px;
            border: 1px solid rgba(217, 168, 95, 0.2); animation: premiumPulse 2.5s infinite;
        }
        @keyframes premiumPulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); border-color: rgba(217, 168, 95, 0.5); }
        }

        .card-actions {
            position: absolute; bottom: 24px; width: 100%; display: flex;
            justify-content: center; gap: 16px; padding: 0 28px; z-index: 10;
            background: none; /* Removed the dark gradient background */ 
            height: 80px; align-items: flex-end;
        }

        .action-btn {
            flex: 1; padding: 16px 0; border-radius: 40px; font-size: 14px;
            font-weight: 800; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: all 0.2s;
        }
        .prev-btn { background: rgba(245, 235, 221, 0.05); color: var(--text-main); border: 1px solid rgba(245, 235, 221, 0.2); }
        .prev-btn.disabled { opacity: 0.2; pointer-events: none; }
        .next-btn { background: var(--highlight); color: var(--dark-contrast); border: none; box-shadow: 0 8px 25px rgba(217, 168, 95, 0.3); }

        .deck-empty {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(87, 15, 27, 0.3); border-radius: 40px; border: 2px dashed rgba(217, 168, 95, 0.4); z-index: -1;
        }
        .deck-empty h3 { font-family: 'Sora', sans-serif; font-size: 26px; color: var(--highlight); margin-bottom: 16px; font-weight: 700; }
        .deck-empty p { color: var(--text-main); font-size: 16px; text-align: center; padding: 0 24px; font-weight: 500; opacity: 0.8; line-height: 1.5; }
        .deck-empty-btn {
            margin-top: 32px; padding: 16px 40px; background: var(--highlight); color: var(--dark-contrast); border: none;
            border-radius: 40px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
        }
    </style>


<div class="app-container">

<script>
    /* ==========================================================================
       DATA: VOCABULARY FLASH CARDS (Extracted from Provided Text)
       ========================================================================== */
    const rawFlashcardsData = [
        { q: "Instrumental", a: "Serving as a crucial means, agent, or tool.", hindi: "सहायक / महत्वपूर्ण", ex: "Different levels of blending will be instrumental in addressing concerns.", syn: "Crucial, Influential", ant: "Ineffective, Useless" },
        { q: "Concurrent", a: "Existing, happening, or done at the same time.", hindi: "समवर्ती / साथ-साथ", ex: "Powering agri-R&D must be made concurrent with ethanol substitution.", syn: "Simultaneous, Coinciding", ant: "Sequential, Separate" },
        { q: "Obviate", a: "To remove a need or difficulty.", hindi: "दूर करना / टालना", ex: "This most certainly does not obviate the value of ethanol substitution.", syn: "Preclude, Prevent", ant: "Necessitate, Require" },
        { q: "Sacrosanct", a: "Regarded as too important or valuable to be interfered with.", hindi: "परम पावन / अनुल्लंघनीय", ex: "Food security is considered sacrosanct and cannot be compromised.", syn: "Sacred, Inviolable", ant: "Profane, Expendable" },
        { q: "Equilibrium", a: "A state in which opposing forces or influences are balanced.", hindi: "संतुलन", ex: "It changes the human-fiscal equilibrium in the broader economy.", syn: "Balance, Symmetry", ant: "Imbalance, Instability" },
        { q: "Mitigate", a: "Make less severe, serious, or painful.", hindi: "कम करना", ex: "The diversity of inputs partly mitigates the impact on food security.", syn: "Alleviate, Reduce", ant: "Aggravate, Intensify" },
        { q: "Optimal", a: "Best or most favorable.", hindi: "सर्वोत्तम / अनुकूल", ex: "Determining how much ethanol is optimal remains a complex question.", syn: "Ideal, Perfect", ant: "Worst, Suboptimal" },
        { q: "Technocratic", a: "Relating to the government or control of society by an elite of technical experts.", hindi: "तकनीकी विशेषज्ञों का शासन", ex: "There are calls to turn the body into a purely technocratic commission.", syn: "Bureaucratic, Expert-driven", ant: "Democratic, Unregulated" },
        { q: "Ossifies", a: "Cease developing; become stagnant or rigid.", hindi: "कठोर हो जाना", ex: "Autonomy that ossifies into an end in itself is counterproductive.", syn: "Hardens, Solidifies", ant: "Softens, Evolves" },
        { q: "Catastrophic", a: "Involving or causing sudden great damage or suffering.", hindi: "विनाशकारी", ex: "Half of cancer patients face catastrophic health spending.", syn: "Disastrous, Ruinous", ant: "Beneficial, Fortunate" },
        { q: "Interoperability", a: "The ability of military equipment or groups to operate in conjunction with each other.", hindi: "अंतःक्रियाशीलता", ex: "The joint exercise aimed to enhance interoperability and tactical exchanges.", syn: "Compatibility, Cooperation", ant: "Incompatibility, Isolation" },
        { q: "Fissures", a: "A state of incompatibility or disagreement.", hindi: "दरारें / मतभेद", ex: "It is straight talk meant to smoothen fissures before they widen.", syn: "Cracks, Crevices", ant: "Unification, Closure" },
        { q: "Thaw", a: "An increase in friendliness or cordiality.", hindi: "तनाव कम होना / पिघलाव", ex: "There are hints of a thaw in some long-suspended bilateral engagements.", syn: "Easing, Relaxation", ant: "Freeze, Hostility" },
        { q: "Verifiable", a: "Able to be checked or demonstrated to be true, accurate, or justified.", hindi: "सत्यापन योग्य", ex: "It should link military support to verifiable action against terrorism.", syn: "Provable, Confirmable", ant: "Unverifiable, Questionable" },
        { q: "Scrutiny", a: "Critical observation or examination.", hindi: "सूक्ष्म जांच", ex: "The status of the central bank came under sharp scrutiny.", syn: "Inspection, Review", ant: "Neglect, Ignorance" },
        { q: "Remit", a: "The task or area of activity officially assigned to an individual or organization.", hindi: "कार्यक्षेत्र / अधिकार क्षेत्र", ex: "Questions of policy fall within its regulatory remit.", syn: "Purview, Mandate", ant: "Exclusion, Exemption" },
        { q: "Neoliberal", a: "Favoring policies that promote free-market capitalism and deregulation.", hindi: "नवउदारवादी", ex: "It is an essential element of modern neoliberal dogma.", syn: "Capitalist, Free-market", ant: "Socialist, Collectivist" },
        { q: "Dogma", a: "A principle or set of principles laid down by an authority as incontrovertibly true.", hindi: "सिद्धांत / हठधर्मिता", ex: "Central bank independence is treated as a modern dogma.", syn: "Creed, Doctrine", ant: "Doubt, Skepticism" },
        { q: "Subordinated", a: "Treat or regard as of lesser importance than something else.", hindi: "अधीन किया हुआ", ex: "Parliament has long been subordinated to the political executive.", syn: "Inferior, Dependent", ant: "Superior, Dominant" },
        { q: "Incoherent", a: "Expressed in an incomprehensible or confusing way.", hindi: "असंगत / अस्पष्ट", ex: "This led to an incoherent approach by the apex court.", syn: "Unclear, Disjointed", ant: "Clear, Logical" },
        { q: "Procurement", a: "The action of obtaining or procuring something.", hindi: "खरीद / वसूली", ex: "Open-ended grain procurement depends heavily on good monsoons.", syn: "Acquisition, Purchasing", ant: "Selling, Disposal" },
        { q: "Entrenching", a: "Establish an attitude or habit so firmly that change is unlikely.", hindi: "मजबूत करना / स्थापित करना", ex: "This risks entrenching the country's dependence on edible oil imports.", syn: "Embedding, Ingraining", ant: "Dislodging, Removing" },
        { q: "Arbitration", a: "The use of an arbitrator or panel to settle a dispute.", hindi: "मध्यस्थता", ex: "The panel issued an arbitration ruling regarding the water treaty.", syn: "Mediation, Negotiation", ant: "Litigation, Dispute" },
        { q: "Mandating", a: "Require something to be done; make mandatory.", hindi: "अनिवार्य करना", ex: "The notification enables these alternative fuels rather than mandating them.", syn: "Dictating, Ordering", ant: "Suggesting, Recommending" },
        { q: "Aatmanirbharta", a: "Self-reliance; the ability to depend on oneself or one's own capabilities.", hindi: "आत्मनिर्भरता", ex: "There is an emerging tension between Aatmanirbharta in energy and food.", syn: "Self-sufficiency, Independence", ant: "Dependence, Reliance" },
        { q: "Immunotherapy", a: "The prevention or treatment of disease with substances that stimulate the immune response.", hindi: "प्रतिरक्षा चिकित्सा", ex: "The new immunotherapy drug continues to be highly expensive.", syn: "Biotherapy, Treatment", ant: "Harm, Aggravation" },
        { q: "Outpatients", a: "A patient who receives medical treatment without being admitted to a hospital.", hindi: "बाह्य रोगी", ex: "A vast majority of those treated as outpatients incurred huge costs.", syn: "Day patient, Clinic patient", ant: "Inpatient, Admitted patient" },
        { q: "Civilisational", a: "Relating to the stage of human social and cultural development.", hindi: "सभ्यतागत", ex: "They were invited to the inaugural Civilisational Dialogue Forum.", syn: "Cultural, Societal", ant: "Primitive, Barbaric" },
        { q: "Endorsing", a: "Declare one's public approval or support of.", hindi: "समर्थन करना", ex: "They ended up endorsing a vague doctrine of consultation.", syn: "Supporting, Backing", ant: "Opposing, Rejecting" },
        { q: "Over-exploited", a: "Used to an excessive degree, leading to depletion.", hindi: "अति-शोषित", ex: "Distilleries should not be established in over-exploited groundwater blocks.", syn: "Depleted, Overused", ant: "Preserved, Conserved" }
    ];

    /* ==========================================================================
       TINDER DECK LOGIC (Resource-Optimized Virtual DOM)
       ========================================================================== */
    const deckContainer = document.getElementById('card-deck');
    let currentCards = [];
    let swipedStack = [];

    function updatePrevButtons() {
        const hasPrev = swipedStack.length > 0;
        document.querySelectorAll('.prev-btn').forEach(btn => {
            hasPrev ? btn.classList.remove('disabled') : btn.classList.add('disabled');
        });
    }

    function initializeDeck() {
        deckContainer.querySelectorAll('.flashcard').forEach(el => el.remove());
        swipedStack = [];

        currentCards = [...rawFlashcardsData].sort(() => Math.random() - 0.5);

        currentCards.slice().reverse().forEach((data, index) => {
            const cardEl = document.createElement('div');
            cardEl.className = 'flashcard';
            cardEl.style.zIndex = index + 10;

            cardEl.innerHTML = `
                <div class="flashcard-inner">
                    <div class="flashcard-face flashcard-front">
                        <div class="card-content-wrapper">
                            <div class="card-content">${data.q}</div>
                        </div>
                        <div class="tap-hint">Tap anywhere for meaning</div>
                    </div>
                    <div class="flashcard-face flashcard-back">
                        <div class="card-label">Meaning</div>
                        <div class="card-content-wrapper">
                            <div class="card-content">
                                ${data.a}
                                <span class="hindi-meaning">(${data.hindi})</span>
                            </div>
                            <div class="card-example">${data.ex}</div>
                            <div class="card-syn-ant">
                                <div><strong class="syn-label">Synonyms:</strong> ${data.syn}</div>
                                <div><strong class="ant-label">Antonyms:</strong> ${data.ant}</div>
                            </div>
                        </div>
                        <div class="card-actions">
                            <button class="action-btn prev-btn disabled" onclick="prevCard(event)">Previous</button>
                            <button class="action-btn next-btn" onclick="swipeCard(event, this)">Next</button>
                        </div>
                    </div>
                </div>
            `;

            cardEl.addEventListener('click', function(e) {
                if (e.target.closest('.action-btn')) return;
                const allCards = Array.from(deckContainer.querySelectorAll('.flashcard:not(.swiped)'));
                if (allCards[allCards.length - 1] === cardEl) {
                    this.classList.toggle('is-flipped');
                }
            });

            deckContainer.appendChild(cardEl);
        });

        updateStackVisuals();
    }

    window.swipeCard = function(e, btnElement) {
        e.stopPropagation();
        const card = btnElement.closest('.flashcard');
        card.classList.add('swiped');
        swipedStack.push(card);
        
        updateStackVisuals();

        setTimeout(() => { 
            card.style.display = 'none'; 
            card.classList.remove('is-flipped');
        }, 500); 
    };

    window.prevCard = function(e) {
        e.stopPropagation();
        if (swipedStack.length === 0) return;
        const lastCard = swipedStack.pop();
        
        lastCard.style.display = 'block';
        void lastCard.offsetWidth;
        lastCard.classList.remove('swiped');
        
        updateStackVisuals();
    };

    function updateStackVisuals() {
        const remaining = Array.from(deckContainer.querySelectorAll('.flashcard:not(.swiped)'));
        
        remaining.forEach((card, i) => {
            const visualIndex = remaining.length - 1 - i;
            
            if (visualIndex === 0) {
                card.style.display = 'block';
                card.style.opacity = '1';
                card.style.transform = 'scale(1) translateY(0px)';
                card.style.pointerEvents = 'auto';
            } else if (visualIndex === 1) {
                card.style.display = 'block';
                card.style.opacity = '0.9';
                card.style.transform = 'scale(0.95) translateY(16px)';
                card.style.pointerEvents = 'none';
            } else if (visualIndex === 2) {
                card.style.display = 'block';
                card.style.opacity = '0.7';
                card.style.transform = 'scale(0.90) translateY(32px)';
                card.style.pointerEvents = 'none';
            } else {
                card.style.display = 'none'; 
            }
        });
        updatePrevButtons();
    }

    initializeDeck();

    /* ==========================================================================
       SMART LIVE USERS TRACKER
       ========================================================================== */
    let currentUsers = 2854;
    const aspirantNode = document.getElementById('aspirant-count');

    setInterval(() => {
        const hour = new Date().getHours();
        const isPeak = (hour >= 9 && hour <= 10) || (hour >= 13 && hour <= 14) || (hour >= 17 && hour <= 19);
        
        const targetMin = isPeak ? 8500 : 1500;
        const targetMax = isPeak ? 14000 : 3500;
        
        if (currentUsers < targetMin) {
            currentUsers += Math.floor(Math.random() * 800) + 200;
        } else if (currentUsers > targetMax) {
            currentUsers -= Math.floor(Math.random() * 500) + 100;
        } else {
            const change = Math.floor(Math.random() * 60) - 20; 
            currentUsers += change;
        }
        
        aspirantNode.innerText = currentUsers.toLocaleString('en-US');
    }, 3500);

</script>
